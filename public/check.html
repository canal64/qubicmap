  var LG="en",D=null,$=function(i){return document.getElementById(i)};

  function apply(l){LG=I[l]?l:"en";document.documentElement.lang=LG;
    [].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.innerHTML=L(e.getAttribute("data-i"))});
    $("q").placeholder=L("ph");document.title=L("h1")+" · qubicmap";
    [].forEach.call(document.querySelectorAll(".lang button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===LG))});
    if(D)meta();if($("out").innerHTML)check(true)}
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){b.onclick=function(){var l=b.getAttribute("data-l");try{localStorage.setItem("qm_check_lang",l)}catch(e){}apply(l)}});

    $("asof").textContent=L("asof",{a:when(m.from),b:when(m.to)});

    $("cols").innerHTML=Object.keys(c).sort(function(a,b){return c[b].q-c[a].q}).map(function(k){return '<p class="col"><a href="'+X+'address/'+k+'" target="_blank" rel="noopener">'+k+'</a><br>'+fmt(c[k].n)+' '+L("addrs")+' · '+fmt(c[k].q)+' QU</p>'}).join("")}

    var tx=x[4].map(function(h){return '<a class="mono" href="'+X+'tx/'+esc(h)+'" target="_blank" rel="noopener">'+esc(h)+'</a>'}).join("<br>");

      '<dt>'+L("d_to")+'</dt><dd class="mono"><a href="'+X+'address/'+esc(x[3])+'" target="_blank" rel="noopener">'+esc(x[3])+'</a></dd>'+
      '<dt>'+L(x[4].length>1?"d_txs":"d_tx")+'</dt><dd>'+tx+'</dd></dl></div>';
  }
  $("f").addEventListener("submit",function(e){e.preventDefault();check()});
})();
