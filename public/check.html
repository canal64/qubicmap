<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qubic weak-seed incident · Notice</title>
<meta name="description" content="Qubic network is live again. Weak-seed fund reclaim is open on the official site only.">
<link rel="canonical" href="https://qubicmap.org/check"><meta name="theme-color" content="#0b0d10">
<style>
:root{--bg:#0b0d10;--ink:#d8dde3;--muted:#8a929b;--rule:#22272e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 60px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}
.lang button{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:4px;padding:2px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--muted)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
</style></head><body><div class="wrap">
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="fr">FR</button><button type="button" data-l="es">ES</button></div>
<pre id="t"></pre>
</div>
<script>
(function(){
var T={
en:"QUBIC · WEAK-SEED INCIDENT\nNetwork live again · fund reclaim open\n\nOfficial reclaim site (the only one):\nweak-seed-reclaim.qubic.org\n\nType this address yourself in your browser.\n\n- The site includes an address checker.\n- Claim to a brand-new identity made with a secure seed.\n- Claim window open until 1 May 2027.\n\nThe Qubic team will never DM you first\nand will never ask for your seed.\nIgnore any other link or \"claim\" site.",
fr:"QUBIC · INCIDENT DES SEEDS FAIBLES\nRéseau relancé · récupération des fonds ouverte\n\nSite officiel de récupération (le seul) :\nweak-seed-reclaim.qubic.org\n\nTapez vous-même cette adresse dans votre navigateur.\n\n- Le site intègre un vérificateur d'adresse.\n- Les fonds sont rendus sur une nouvelle identité créée avec une seed sûre.\n- Demandes ouvertes jusqu'au 1er mai 2027.\n\nL'équipe Qubic ne vous contactera jamais en premier\net ne vous demandera jamais votre seed.\nIgnorez tout autre lien ou site de « claim ».",
es:"QUBIC · INCIDENTE DE SEMILLAS DÉBILES\nRed activa de nuevo · recuperación de fondos abierta\n\nSitio oficial de recuperación (el único):\nweak-seed-reclaim.qubic.org\n\nEscribe tú mismo esta dirección en tu navegador.\n\n- El sitio incluye un verificador de direcciones.\n- Los fondos se devuelven a una identidad nueva creada con una semilla segura.\n- Plazo abierto hasta el 1 de mayo de 2027.\n\nEl equipo de Qubic nunca te escribirá primero\nni te pedirá tu semilla.\nIgnora cualquier otro enlace o sitio de \"claim\"."};
function pick(){var q=(location.search.match(/[?&]lang=(en|fr|es)/)||[])[1];if(q)return q;try{var s=localStorage.getItem("qm_check_lang");if(s&&T[s])return s}catch(e){}var n=(navigator.language||"en").slice(0,2);return T[n]?n:"en"}
function apply(l){l=T[l]?l:"en";document.documentElement.lang=l;document.getElementById("t").textContent=T[l];
[].forEach.call(document.querySelectorAll(".lang button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===l)})}
[].forEach.call(document.querySelectorAll(".lang button"),function(b){b.onclick=function(){var l=b.getAttribute("data-l");try{localStorage.setItem("qm_check_lang",l)}catch(e){}apply(l)}});
apply(pick());
})();
</script></body></html>
