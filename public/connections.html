      if(sel){nb={};nb[sel.id]=1;sel.e.forEach(function(e){nb[e.a.id]=1;nb[e.b.id]=1})}
      /* the Qubic mark on the central sphere, sized to the sphere as the camera moves */
      var co=G3.graphData().nodes[0];if(co.x!=null){var cc=G3.graph2ScreenCoords(co.x,co.y,co.z),ce=G3.graph2ScreenCoords(co.x,co.y+4*Math.cbrt(46),co.z),pr=Math.hypot(ce.x-cc.x,ce.y-cc.y),dim=sel&&!nb.core;
        var want=dim?tok.panel:tok.void;if(want!==lgc){lgc=want;lg.src=logoURI(want)}lg.style.width=lg.style.height=(pr*1.25)+"px";lg.style.transform="translate("+(cc.x-pr*.625)+"px,"+(cc.y-pr*.625)+"px)";lg.style.display=pr>3?"":"none"}
      G3.graphData().nodes.forEach(function(o){var d=map[o.id],n=byId[o.id];d.style.display="none";if(o.x==null||!famOn[n.f]||(nb&&!nb[o.id]))return;
        var c=G3.graph2ScreenCoords(o.x,o.y,o.z);if(c.x<4||c.y<8||c.x>W-20||c.y>H-8)return;
        var dist=Math.hypot(cam.x-o.x,cam.y-o.y,cam.z-o.z);dmin=Math.min(dmin,dist);dmax=Math.max(dmax,dist);list.push([o,n,c,dist])});
      /* nearest first; a name that would sit on top of one already placed is skipped */
      list.forEach(function(x){x[4]=x[1].hub||nb?2:1-(x[3]-dmin)/Math.max(1,dmax-dmin)});list.sort(function(a,b){return b[4]-a[4]});
      var placed=[];list.forEach(function(x){var d=map[x[0].id],w=x[1].n.length*(x[1].hub?8:6.2)+4,h=x[1].hub?16:13,bx=x[2].x+7,by=x[2].y-8;
        for(var k=0;k<placed.length;k++){var q=placed[k];if(bx<q[0]+q[2]&&bx+w>q[0]&&by<q[1]+q[3]&&by+h>q[1])return}
        placed.push([bx,by,w,h]);d.style.display="";d.style.opacity=x[4]>=2?1:.4+.6*x[4];d.style.transform="translate("+bx+"px,"+by+"px)"})}
    requestAnimationFrame(tick)})()}
function close3D(){if(!g3on)return;g3on=false;g3el.hidden=true;if(G3)G3.pauseAnimation()}

fsb.onclick=function(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}if(app.classList.contains("max")){pseudo(false);return}
  var req=app.requestFullscreen||app.webkitRequestFullscreen;if(!req){pseudo(true);return}
  try{var r=req.call(app);if(r&&r.then)r.then(fsSync,function(){pseudo(true)});else setTimeout(function(){if(!fsEl())pseudo(true)},250)}catch(e){pseudo(true)}};
