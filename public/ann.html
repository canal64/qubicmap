<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qubic ANN Explorer</title>
<meta name="description" content="See the artificial neural networks Qubic miners find for Aigarth: open a top solution, view its neurons layer by layer, replay and modify it. Viewer built by dkat, hosted on the Qubic Ecosystem Map.">
<link rel="canonical" href="https://qubicmap.org/ann"><meta property="og:type" content="website"><meta property="og:title" content="Qubic ANN Explorer"><meta property="og:description" content="Explore the neural networks found by Qubic miners, layer by layer."><meta property="og:url" content="https://qubicmap.org/ann"><meta property="og:image" content="https://qubicmap.org/cover.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#04070c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: slim header with credit, then the viewer filling the rest of the screen. Same dark look as qubicmap.org. */
:root{--void:#04070c;--panel:#0a1019;--rule:#182434;--ink:#dfe9f3;--muted:#7f93a8;--ice:#cfe6ff;--live:#62d6a0;--warn:#f1bb5c;
  --display:"Chakra Petch",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-inline:16px;padding-block:12px;border-bottom:1px solid var(--rule)}
.l{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;min-width:0}
h1{margin:0;font:700 20px var(--display);letter-spacing:.1em;text-transform:uppercase}
h1 span{color:transparent;-webkit-text-stroke:1px var(--ice)}
.sub{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.r{display:flex;gap:14px;align-items:center;font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
.r a{color:var(--ice);text-underline-offset:3px}
.r b{color:var(--warn);font-weight:500}
a:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.frame{flex:1;min-height:70vh;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--panel)}
</style></head><body>
<header>
  <div class="l">
    <h1>Qubic <span>ANN Explorer</span></h1>
    <p class="sub">The neural networks Qubic miners find for Aigarth. Pick a solution, open the leaf, and see its neurons layer by layer.</p>
  </div>
  <div class="r">
    <span>Viewer by <b>dkat</b></span>
    <a href="https://krypdkat.github.io/bpp9kviewer/" target="_blank" rel="noopener">Open full screen ↗</a>
    <a href="/">← Ecosystem Map</a>
  </div>
</header>
<div class="frame"><iframe src="https://krypdkat.github.io/bpp9kviewer/" title="bpp9k ANN viewer by dkat" loading="eager" referrerpolicy="no-referrer" allow="clipboard-write"></iframe></div>
</body></html>
