# Every day, rebuilds the networks of the top miners (7 tried, best 5 kept) (scan + replay checked against the chain)
# and publishes them as public/ann/data/*.json, so qubicmap.org/ann shows them instantly.
name: ann-precompute
on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: ann-precompute
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        name: Top miners from the JetskiPool archive (via qubicmap.org)
        run: |
          node -e '
            const epochs = require("./public/ann/meta.json").epochs;
            const get = async q => {
              for (let i = 0; ; i++) {
                try {
                  const r = await fetch("https://qubicmap.org/api/ann/featured" + q, { headers: { "User-Agent": "Mozilla/5.0 (qubicmap-ann-precompute)", Accept: "application/json" } });
                  const t = await r.text();
                  if (!r.ok) throw new Error("HTTP " + r.status + " " + t.slice(0, 200));
                  return JSON.parse(t);
                } catch (e) { if (i >= 3) throw e; await new Promise(z => setTimeout(z, 5000)); }
              }
            };
            (async () => {
              let j = await get("");
              if (!epochs.includes(j.epoch)) j = await get("?epoch=" + Math.max(...epochs));
              const list = (j.items || []).slice(0, 7).map((x, i) => ({ rank: i + 1, id: x.id, epoch: x.epoch, score: x.score }));
              if (!list.length) throw new Error("no featured miners");
              console.log(list);
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "list=" + JSON.stringify(list) + "\n");
            })().catch(e => { console.log("::error::" + String(e && e.message || e).replace(/\n/g, " ")); process.exit(1); });'
  build:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # one miner failing (node unreachable, replay mismatch, too slow) must not fail the run:
    # publish keeps the others, and the run only fails when nothing at all was rebuilt
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        miner: ${{ fromJson(needs.pick.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Rebuild miner ${{ matrix.miner.rank }}
        env:
          ANN_MINUTES: "45"
        run: node scripts/ann-precompute.mjs ${{ matrix.miner.id }} ${{ matrix.miner.epoch }} out
      - uses: actions/upload-artifact@v4
        with:
          name: ann-${{ matrix.miner.rank }}
          path: out/*.json
          retention-days: 2
  publish:
    needs: [pick, build]
    if: always() && needs.pick.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ann-*
          path: new
          merge-multiple: true
      - name: Publish the rebuilt networks
        env:
          LIST: ${{ needs.pick.outputs.list }}
        run: |
          ls new 2>/dev/null || { echo "nothing rebuilt"; exit 1; }
          node scripts/ann-publish.mjs new
          git config user.name "qubicmap-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A public/ann/data
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "ANN: daily rebuild of the top networks"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
