# Keeps qubicmap.org/ann in step with dkat's viewer (github.com/krypdkat/bpp9kviewer).
# Daily: if dkat published a new version, rebuild the page with it, replay a top miner's network
# against the live chain, and only if every step matches publish it (push to main -> Cloudflare deploy).
# A failed run leaves the current page online and GitHub e-mails the repo owner.
name: ann-sync
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and test even if upstream did not change"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: ann-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dkat's repository
        id: up
        run: |
          git clone --depth 1 https://github.com/krypdkat/bpp9kviewer.git /tmp/up
          NEW=$(git -C /tmp/up rev-parse HEAD)
          OLD=$(node -p "require('./vendor/bpp9kviewer/UPSTREAM.json').sha")
          echo "upstream $NEW, ours $OLD"
          if [ "$NEW" != "$OLD" ] || [ "${{ inputs.force }}" = "true" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
          echo "sha=$NEW" >> "$GITHUB_OUTPUT"
      - name: Rebuild the page with the new version
        if: steps.up.outputs.go == '1'
        run: |
          cp /tmp/up/index.html vendor/bpp9kviewer/index.html
          git -C /tmp/up log -1 --format='{"repo":"krypdkat/bpp9kviewer","sha":"%H","date":"%cI"}' > vendor/bpp9kviewer/UPSTREAM.json
          node scripts/build-ann.mjs
      - name: Replay a top network against the chain
        if: steps.up.outputs.go == '1'
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node scripts/test-ann.mjs
      - name: Keep the test screenshot
        if: always() && steps.up.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ann-test
          path: ann-test*.png
          if-no-files-found: ignore
      - name: Publish
        if: steps.up.outputs.go == '1'
        run: |
          git config user.name "qubicmap-bot"; git config user.email "actions@users.noreply.github.com"
          git add vendor/bpp9kviewer public/ann.html public/ann/meta.json
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "ANN viewer: sync dkat's bpp9kviewer ${{ steps.up.outputs.sha }}"
          git push
